<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>Selección de Voleibol · UTEC Tulancingo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏐%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>hola</h1>
  <!-- LOGIN / REGISTRO -->
  <section id="vista-login" hidden>
    <div class="login-box">
      <div class="logo-grande">🏐</div>
      <h1>Selección de Voleibol</h1>
      <p class="sub">UTEC Tulancingo</p>

      <form id="form-login">
        <label>Correo<input type="email" name="email" autocomplete="username" required></label>
        <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="pri">Entrar</button>
      </form>

      <form id="form-registro" hidden>
        <label>Nombre completo<input name="nombre" required></label>
        <label>Correo<input type="email" name="email" autocomplete="username" required></label>
        <label>Contraseña (mín. 6 caracteres)<input type="password" name="password" minlength="6" autocomplete="new-password" required></label>
        <button class="pri">Crear cuenta</button>
      </form>

      <button class="link" id="alternar">¿No tienes cuenta? Regístrate</button>
    </div>
  </section>


  <div id="app" hidden>
    <header class="top">
      <div class="marca">🏐 <span>Voleibol UTEC</span></div>
      <div class="quien"><span id="quien"></span><button class="sec chico" id="btn-salir">Salir</button></div>
    </header>
    <main id="contenido"></main>
    <nav id="tabs"></nav>
  </div>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
